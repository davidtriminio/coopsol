<div class="page">
  <div class="card" [animate.enter]="'card-in'">
    <div class="brand">
      <div class="brand-mark">CS</div>
      <div class="brand-mark">CoopSol</div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <h1>Bienvenido</h1>
      <p class="sub">Inicia sesión con tu cuenta de staff</p>

      <label class="field">
        <span>Correo</span>
        <input type="email" formControlName="email" autocomplete="username"/>
      </label>

      <p class="field-error" [class.is-visible]="form.controls.email.touched && form.controls.email.invalid">Ingresa un
        correo válido</p>

      <label class="field">
        <span>Contraseña</span>
        <input type="password" formControlName="password" autocomplete="current-password"/>
      </label>

      <p class="field-error" [class.is-visible]="form.controls.password.touched && form.controls.password.invalid">La
        contraseña es obligatoria</p>

      <p class="form-error" [class.is-visible]="!!errorMessage()">{{ errorMessage() }}</p>

      <button type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        <span>{{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}</span>
      </button>
    </form>
  </div>
</div>

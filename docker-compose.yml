services:
  postgres:
    image: postgres:17
    container_name: coopsol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coopsol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD no está definida. Por favor, defínela en el archivo .env o en tu entorno.}
      POSTGRES_DB: ${POSTGRES_DB:-coopsol}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - coopsol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER-coopsol} -d ${POSTGRES_DB:-coopsol_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  coopsol_pgdata: